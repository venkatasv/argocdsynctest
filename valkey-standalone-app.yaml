# valkey-standalone-app.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: valkey-standalone
spec:
  project: default
  source:
    repoURL: repoURL: https://valkey-io.github.io/valkey-helm/
    chart: valkey
    targetRevision: "0.11.0"     # check github.com/valkey-io/valkey-helm/releases for newer
    helm:
      values: |
        auth:
          enabled: true
          password: "ChangeMeValkey123!"
        persistence:
          enabled: true
          size: 8Gi
  destination:
    server: https://kubernetes.default.svc
    namespace: redis-standalone
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
