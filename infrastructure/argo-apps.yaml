---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: redis-standalone
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: 'https://charts.bitnami.com/bitnami'
      chart: redis
      targetRevision: 18.2.1               # <-- Use exact version (e.g. 18.2.1 instead of 18.x.x)
      helm:
        valueFiles:
          - '$values/infrastructure/redis-standalone/values.yaml'
    - repoURL: 'https://github.com/venkatasv/argocdsynctest.git'
      targetRevision: HEAD
      ref: values                          # <-- Must match $values above
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: redis
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true                # <-- Auto-creates the 'redis' namespace if missing

