apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: redis-standalone
  namespace: argocd
spec:
  destination:
    namespace: redis
    server: https://kubernetes.default.svc
  project: default
  sources:
  - path: .
    ref: HEAD
    repoURL: https://github.com/venkatasv/argocdsynctest.git
  - chart: redis
    helm:
      valueFiles:
      - $HEAD:/infrastructure/redis-standalone/values.yaml
    repoURL: https://charts.bitnami.com/bitnami
    targetRevision: 18.2.1
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
---
