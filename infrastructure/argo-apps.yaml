---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: redis-standalone
  namespace: argocd
spec:
  project: gitops
  sources:
    - repoURL: 'https://charts.bitnami.com/bitnami'
      chart: redis
      targetRevision: 18.2.1
      helm:
        valueFiles:
          - 'infrastructure/redis-standalone/values.yaml'
    - repoURL: 'https://github.com/venkatasv/argocdsynctest.git'
      targetRevision: HEAD
      path: infrastructure/redis-standalone
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: redis
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

