apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: redis-standalone
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://charts.bitnami.com/bitnami'
    chart: redis
    targetRevision: 20.4.0
    helm:
      valuesObject:
        architecture: standalone
        auth:
          enabled: true
        master:
          persistence:
            enabled: true
            size: 2Gi
            storageClass: standard
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: redis
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
